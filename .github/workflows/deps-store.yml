name: Dependencies (store)

# The only job allowed to write packages. It runs on push to the protected
# branches, or by hand, so recipes come from the pushed commit, never from a
# pull request head. parser-wasm is never published: it travels only through
# the layer cache within one run.
on:
  push:
    branches: [ "devel-tklip", "devel", "master" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # One private OCI artifact per store entry, tagged <dep>-<id>.
  TAU_STORE_REMOTE: ghcr.io/${{ github.repository }}

jobs:
  publish:
    name: Publish Linux, MinGW and cross-arm64 packages
    runs-on: ubuntu-24.04
    env:
      # ubuntu-24.04 runners are 4-core
      BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: crazy-max/ghaction-github-runtime@v4

      # TESTS=no keeps it to a configure; the store is what the run leaves
      # behind and TAU_STORE_PUBLISH uploads.
      - name: Resolve and publish the Linux store packages
        run: |
          ./dev docker linux \
            --build-arg BUILD_JOBS=${{ env.BUILD_JOBS }} \
            --build-arg TESTS=no \
            --build-arg TAU_STORE_REMOTE=${{ env.TAU_STORE_REMOTE }} \
            --build-arg TAU_STORE_PUBLISH=ON \
            --secret id=gh_token,env=GH_TOKEN \
            --cache-from type=gha,scope=parser-deps
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve and publish the MinGW store packages
        run: |
          ./dev docker linux-mingw64-wine \
            --build-arg BUILD_JOBS=${{ env.BUILD_JOBS }} \
            --build-arg TESTS=no \
            --build-arg TAU_STORE_REMOTE=${{ env.TAU_STORE_REMOTE }} \
            --build-arg TAU_STORE_PUBLISH=ON \
            --secret id=gh_token,env=GH_TOKEN \
            --cache-from type=gha,scope=parser-deps
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The cross arm64 packages are clang-built on this host; the arm64 job
      # builds the native ones with a different id.
      - name: Install the cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang g++-aarch64-linux-gnu ninja-build

      - name: Install oras for the dependency store
        run: ./dev dep-oras

      - name: Log in to the dependency store
        run: oras login "${TAU_STORE_REMOTE%%/*}" -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"

      - name: Resolve and publish the cross-arm64 store packages
        run: |
          ./dev preset release-arm64 --configure-only -DTAU_PARSER_DEPS_FROM_STORE=ON \
            -DTAU_BUILD_JOBS=${{ env.BUILD_JOBS }}
          ./dev store-publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The native arm64 packages are built on an arm host: the linux-arm64
  # target names the machine arch, and the arm container is the compiler
  # their consumers use.
  publish-linux-arm64:
    name: Publish Linux arm64 packages
    runs-on: ubuntu-24.04-arm
    env:
      BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: crazy-max/ghaction-github-runtime@v4

      - name: Resolve and publish the Linux arm64 store packages
        run: |
          ./dev docker linux \
            --build-arg BUILD_JOBS=${{ env.BUILD_JOBS }} \
            --build-arg TESTS=no \
            --build-arg TAU_STORE_REMOTE=${{ env.TAU_STORE_REMOTE }} \
            --build-arg TAU_STORE_PUBLISH=ON \
            --secret id=gh_token,env=GH_TOKEN \
            --cache-from type=gha,scope=parser-deps
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The macOS packages are AppleClang-built and cannot come from the Linux job.
  publish-macos:
    name: Publish macOS packages
    runs-on: macos-15
    env:
      TAU_BUILD_JOBS: 3
    steps:
      - uses: actions/checkout@v7

      - name: Install oras for the dependency store
        run: ./dev dep-oras

      - name: Log in to the dependency store
        run: oras login "${TAU_STORE_REMOTE%%/*}" -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"

      - name: Resolve and publish the macOS store packages
        run: |
          ./dev preset release --configure-only -DTAU_PARSER_DEPS_FROM_STORE=ON \
            -DTAU_BUILD_JOBS=${{ env.TAU_BUILD_JOBS }}
          ./dev store-publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The MSVC packages are cl.exe-built and cannot come from the Linux job.
  publish-windows:
    name: Publish Windows MSVC packages
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      TAU_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v7

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: seanmiddleditch/gha-setup-ninja@v6

      - name: Install oras for the dependency store
        run: ./dev dep-oras

      - name: Log in to the dependency store
        run: oras login "${TAU_STORE_REMOTE%%/*}" -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"

      - name: Resolve and publish the MSVC store packages
        run: |
          ./dev preset release-msvc --configure-only -DTAU_PARSER_DEPS_FROM_STORE=ON \
            -DTAU_BUILD_JOBS=${{ env.TAU_BUILD_JOBS }}
          ./dev store-publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
