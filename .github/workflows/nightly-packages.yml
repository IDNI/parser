name: Nightly Packages

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  check_date:
    runs-on: ubuntu-24.04
    name: Check latest commit
    outputs:
      should_run: ${{ steps.should_run.outputs.should_run }}
    steps:
      - uses: actions/checkout@v7

      - name: print latest_commit
        run: echo ${{ github.sha }}

      - id: should_run
        continue-on-error: true
        name: check latest commit is less than a day
        if: ${{ github.event_name == 'schedule' }}
        run: |
          if [ -z "$(git rev-list --after="24 hours" ${{ github.sha }})" ]; then
            echo "should_run=false" >> $GITHUB_OUTPUT
          else
            echo "should_run=true" >> $GITHUB_OUTPUT
          fi

      - name: print should_run
        run: echo ${{ steps.should_run.outputs.should_run }}

  check_tests:
    needs: check_date
    if: ${{ needs.check_date.outputs.should_run != 'false' }}
    runs-on: ubuntu-24.04
    name: Require a green test run
    steps:
      # The nightly packages a commit only after its own Test Release run
      # passed. A commit with no completed run does not qualify.
      - name: Read the Test Release result for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          conclusion=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/test-release.yml/runs?head_sha=${{ github.sha }}&status=completed" \
            --jq '.workflow_runs[0].conclusion // "none"')
          echo "Test Release conclusion for ${{ github.sha }}: ${conclusion}"
          if [ "${conclusion}" != "success" ]; then
            echo "::error::Test Release did not pass for this commit (${conclusion})"
            exit 1
          fi

  build_and_deploy_nightly:
    needs: [check_date, check_tests]
    if: ${{ needs.check_date.outputs.should_run != 'false' }}
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Build image with nightly packages
        run: >
          ./dev docker nightly
          --build-arg TESTS=no
          --build-arg BUILD_JOBS=4

      - name: Copy nightly packages and generated API documentation from container
        run: |
          CID=$(docker create parser:nightly)
          docker cp $CID:/parser/build/release/packages ${{ github.workspace }}/
          docker cp $CID:/parser/build/release/_site ${{ github.workspace }}/
          docker rm $CID

      - name: Read Version
        id: version
        run: echo "version=v$(head -n 1 VERSION)" >> $GITHUB_ENV

      - name: Get ISO date
        id: date_iso
        run: echo "date_iso=$(date --iso)" >> $GITHUB_ENV

      - name: Upload nightly packages
        uses: actions/upload-artifact@v7
        with:
          name: "nightly-${{ env.date_iso }}"
          path: |
            ${{ github.workspace }}/packages/*.deb
            ${{ github.workspace }}/packages/*.rpm

      - name: Create Nightly Build Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "nightly-${{ env.date_iso }}"
          name: "Tau Parser Library ${{ env.version }} Nightly Build ${{ env.date_iso }}"
          body: "Tau Parser Library ${{ env.version }} automated nightly build ${{ env.date_iso }} commit ${{ github.sha }}"
          draft: false
          prerelease: true
          files: ${{ github.workspace }}/packages/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ github.workspace }}/_site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5

  macos_package:
    needs: [check_date, check_tests]
    if: ${{ needs.check_date.outputs.should_run != 'false' }}
    runs-on: macos-15
    env:
      # macos-15 runners are 3-core arm64
      TAU_BUILD_JOBS: 3
    steps:
      - uses: actions/checkout@v7

      - name: Get ISO date
        run: echo "date_iso=$(date +%F)" >> $GITHUB_ENV

      - name: Build the macOS package
        run: ./dev preset release-macos-packages -DTAU_BUILD_JOBS=${{ env.TAU_BUILD_JOBS }}

      # The artifact stays out of the nightly release on purpose. It is for
      # testing the package before it becomes official.
      - name: Upload the macOS package
        uses: actions/upload-artifact@v7
        with:
          name: "macos-nightly-${{ env.date_iso }}"
          path: |
            build/release/packages/*.dmg
            build/release/packages/*.zip
