name: Nightly Packages

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  check_date:
    # A hung job fails early instead of running to the 6 hour limit.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    name: Check latest commit
    outputs:
      should_run: ${{ steps.should_run.outputs.should_run }}
    steps:
      - uses: actions/checkout@v7

      - name: print latest_commit
        run: echo ${{ github.sha }}

      - id: should_run
        continue-on-error: true
        name: check latest commit is less than a day
        if: ${{ github.event_name == 'schedule' }}
        run: |
          if [ -z "$(git rev-list --after="24 hours" ${{ github.sha }})" ]; then
            echo "should_run=false" >> $GITHUB_OUTPUT
          else
            echo "should_run=true" >> $GITHUB_OUTPUT
          fi

      - name: print should_run
        run: echo ${{ steps.should_run.outputs.should_run }}

  check_tests:
    needs: check_date
    if: ${{ needs.check_date.outputs.should_run != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    name: Require a green test run
    steps:
      # The nightly packages a commit only after its own Test Release run
      # passed. A commit with no completed run does not qualify.
      - name: Read the Test Release result for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          conclusion=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/test-release.yml/runs?head_sha=${{ github.sha }}&status=completed" \
            --jq '.workflow_runs[0].conclusion // "none"')
          echo "Test Release conclusion for ${{ github.sha }}: ${conclusion}"
          if [ "${conclusion}" != "success" ]; then
            echo "::error::Test Release did not pass for this commit (${conclusion})"
            exit 1
          fi

  linux_x86_64_package:
    name: Linux x86_64 · package
    needs: [check_date, check_tests]
    if: ${{ needs.check_date.outputs.should_run != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Build image with nightly packages
        run: >
          ./dev docker nightly
          --build-arg TESTS=no
          --build-arg W64_PACKAGES=no
          --build-arg BUILD_JOBS=4

      - name: Copy nightly packages and generated API documentation from container
        run: |
          CID=$(docker create parser:nightly)
          docker cp $CID:/parser/build/release/packages ${{ github.workspace }}/
          docker cp $CID:/parser/build/release/_site ${{ github.workspace }}/
          docker rm $CID

      - name: Upload the Linux packages
        uses: actions/upload-artifact@v7
        with:
          name: linux-x86_64-nightly
          path: |
            ${{ github.workspace }}/packages/*.deb
            ${{ github.workspace }}/packages/*.rpm
          if-no-files-found: error

      - name: Upload the API documentation
        uses: actions/upload-artifact@v7
        with:
          name: site-nightly
          path: ${{ github.workspace }}/_site
          if-no-files-found: error

  # The same image on an arm runner. The API documentation comes from the
  # x86_64 job only.
  linux_arm64_package:
    name: Linux arm64 · package
    needs: [check_date, check_tests]
    if: ${{ needs.check_date.outputs.should_run != 'false' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Build image with nightly packages
        run: >
          ./dev docker nightly
          --build-arg TESTS=no
          --build-arg W64_PACKAGES=no
          --build-arg BUILD_JOBS=4

      - name: Copy nightly packages from container
        run: |
          CID=$(docker create parser:nightly)
          docker cp $CID:/parser/build/release/packages ${{ github.workspace }}/
          docker rm $CID

      - name: Upload the Linux packages
        uses: actions/upload-artifact@v7
        with:
          name: linux-arm64-nightly
          path: |
            ${{ github.workspace }}/packages/*.deb
            ${{ github.workspace }}/packages/*.rpm
          if-no-files-found: error

  # A nightly publishes every package job that passed. A failed job does not
  # stop the others, and the run fails only when no job built a package.
  publish:
    name: Publish
    needs: [check_date, check_tests, linux_x86_64_package, linux_arm64_package,
      macos_arm64_package, macos_x86_64_package, windows_msvc_package,
      wasm_npm_package]
    if: ${{ always() && needs.check_date.result == 'success' && needs.check_date.outputs.should_run != 'false' && needs.check_tests.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Read Version
        run: echo "version=v$(head -n 1 VERSION)" >> $GITHUB_ENV

      - name: Get ISO date
        run: echo "date_iso=$(date --iso)" >> $GITHUB_ENV

      - name: Download the Linux x86_64 packages
        if: needs.linux_x86_64_package.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: linux-x86_64-nightly
          path: ${{ github.workspace }}/packages

      - name: Download the Linux arm64 packages
        if: needs.linux_arm64_package.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: linux-arm64-nightly
          path: ${{ github.workspace }}/packages

      - name: Download the macOS arm64 package
        if: needs.macos_arm64_package.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: macos-arm64-nightly
          path: ${{ github.workspace }}/packages

      - name: Download the macOS x86_64 package
        if: needs.macos_x86_64_package.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: macos-x86_64-nightly
          path: ${{ github.workspace }}/packages

      - name: Download the Windows MSVC packages
        if: needs.windows_msvc_package.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: windows-msvc-nightly
          path: ${{ github.workspace }}/packages

      - name: Download the WebAssembly npm package
        if: needs.wasm_npm_package.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: wasm-npm-nightly
          path: ${{ github.workspace }}/packages

      - name: Require at least one package
        run: |
          if [ -z "$(find packages -type f 2>/dev/null | head -n 1)" ]; then
            echo "::error::No package job built a package, so no nightly release is made."
            exit 1
          fi

      - name: Create Nightly Build Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "nightly-${{ env.date_iso }}"
          name: "Tau Parser Library ${{ env.version }} Nightly Build ${{ env.date_iso }}"
          body: "Tau Parser Library ${{ env.version }} automated nightly build ${{ env.date_iso }} commit ${{ github.sha }}"
          draft: false
          prerelease: true
          files: ${{ github.workspace }}/packages/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The API documentation comes from the Linux job.
      - name: Download the API documentation
        if: needs.linux_x86_64_package.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: site-nightly
          path: ${{ github.workspace }}/_site

      - name: Setup Pages
        if: needs.linux_x86_64_package.result == 'success'
        uses: actions/configure-pages@v6

      - name: Upload artifact
        if: needs.linux_x86_64_package.result == 'success'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ github.workspace }}/_site

      - name: Deploy to GitHub Pages
        if: needs.linux_x86_64_package.result == 'success'
        id: deployment
        uses: actions/deploy-pages@v5

  macos_arm64_package:
    name: macOS arm64 · package
    needs: [check_date, check_tests]
    if: ${{ needs.check_date.outputs.should_run != 'false' }}
    runs-on: macos-15
    timeout-minutes: 240
    env:
      # macos-15 runners are 3-core arm64
      TAU_BUILD_JOBS: 3
    steps:
      - uses: actions/checkout@v7

      - name: Build the macOS package
        run: ./dev preset release-macos-packages -DTAU_BUILD_JOBS=${{ env.TAU_BUILD_JOBS }}

      - name: Upload the macOS package
        uses: actions/upload-artifact@v7
        with:
          name: macos-arm64-nightly
          path: |
            build/release/packages/*.dmg
            build/release/packages/*.zip
          if-no-files-found: error

  macos_x86_64_package:
    name: macOS x86_64 · package
    needs: [check_date, check_tests]
    if: ${{ needs.check_date.outputs.should_run != 'false' }}
    runs-on: macos-15-intel
    timeout-minutes: 240
    env:
      # macos-15-intel runners are 4-core x86_64
      TAU_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v7

      - name: Build the macOS package
        run: ./dev preset release-macos-packages -DTAU_BUILD_JOBS=${{ env.TAU_BUILD_JOBS }}

      - name: Upload the macOS package
        uses: actions/upload-artifact@v7
        with:
          name: macos-x86_64-nightly
          path: |
            build/release/packages/*.dmg
            build/release/packages/*.zip
          if-no-files-found: error

  windows_msvc_package:
    name: Windows MSVC · package
    needs: [check_date, check_tests]
    if: ${{ needs.check_date.outputs.should_run != 'false' }}
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        shell: bash
    env:
      # windows-latest runners are 4-core
      TAU_BUILD_JOBS: 4
      TAU_STORE_REMOTE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # The windows-latest image has no NSIS, and CPack needs makensis.
      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          Add-Content $env:GITHUB_PATH "${env:ProgramFiles(x86)}\NSIS"

      - name: Restore the dependency store (~/.tau/store)
        uses: actions/cache/restore@v6
        with:
          path: ~/.tau/store
          key: parser-store-windows-latest-${{ github.sha }}
          restore-keys: |
            parser-store-windows-latest-

      - name: Install oras for the dependency store
        run: ./dev dep-oras

      - name: Log in to the dependency store
        run: oras login "${TAU_STORE_REMOTE%%/*}" -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"

      - name: Build the NSIS installer
        run: |
          ./dev preset release-msvc-packages -DTAU_BUILD_JOBS=${{ env.TAU_BUILD_JOBS }} \
            -DTAU_PARSER_DEPS_FROM_STORE=ON

      - name: Build the zip package
        run: |
          ./dev preset release-msvc-packages-zip -DTAU_BUILD_JOBS=${{ env.TAU_BUILD_JOBS }} \
            -DTAU_PARSER_DEPS_FROM_STORE=ON

      - name: Upload the Windows packages
        uses: actions/upload-artifact@v7
        with:
          name: windows-msvc-nightly
          path: |
            build/release-msvc/packages/*.exe
            build/release-msvc/packages/*.zip
          if-no-files-found: error

  # The wasm-npm Docker stage builds release-wasm and runs npm pack. Nothing
  # publishes the .tgz to a registry.
  wasm_npm_package:
    name: WebAssembly · npm
    needs: [check_date, check_tests]
    if: ${{ needs.check_date.outputs.should_run != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 140
    permissions:
      contents: read
      packages: read
    env:
      # ubuntu-24.04 runners are 4-core
      BUILD_JOBS: 4
      TAU_STORE_REMOTE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # type=gha needs ACTIONS_RUNTIME_TOKEN/ACTIONS_CACHE_URL, which GitHub
      # does not expose to run: steps
      - uses: crazy-max/ghaction-github-runtime@v4

      # NIGHTLY=yes stamps the date into VERSION, as the Docker nightly does.
      - name: Build the npm package
        run: |
          ./dev docker wasm-npm \
            --build-arg NIGHTLY=yes \
            --build-arg BUILD_JOBS=${{ env.BUILD_JOBS }} \
            --build-arg TAU_STORE_REMOTE=${{ env.TAU_STORE_REMOTE }} \
            --secret id=gh_token,env=GH_TOKEN \
            --cache-from type=gha,scope=parser-wasm-deps
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PARSER_NPM_DIR: npm

      - name: Upload the npm package
        uses: actions/upload-artifact@v7
        with:
          name: wasm-npm-nightly
          path: npm/*.tgz
          if-no-files-found: error
