name: Doxygen deployment

on:
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    # A hung job fails early instead of running to the 6 hour limit.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Checkout sources
      uses: actions/checkout@v7
    - name: Setup Pages
      uses: actions/configure-pages@v6
    - name: Build Doxygen
      # Pinned, because Doxygen 1.12 cannot link the <a id> anchors of the docs.
      env:
        DOXYGEN_VERSION: 1.18.0
        DOXYGEN_SHA256: 14fa81bdc34171edb5f1f02b1d60e74802f0439b77fa44e592565d517d72df90
      run: |
        sudo apt-get update
        sudo apt-get install -y graphviz
        curl -fsSL --retry 3 -o "$RUNNER_TEMP/doxygen.tar.gz" \
          "https://github.com/doxygen/doxygen/releases/download/Release_${DOXYGEN_VERSION//./_}/doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz"
        echo "${DOXYGEN_SHA256}  $RUNNER_TEMP/doxygen.tar.gz" | sha256sum -c -
        tar -xzf "$RUNNER_TEMP/doxygen.tar.gz" -C "$RUNNER_TEMP"
        "$RUNNER_TEMP/doxygen-${DOXYGEN_VERSION}/bin/doxygen" Doxyfile
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v5

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
