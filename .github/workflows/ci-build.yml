name: Native Windows and Cross-Compile

on:
  workflow_dispatch:

jobs:
  windows-native:
    name: Native Windows (${{ matrix.compiler }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: msvc
          - compiler: clang-cl
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        shell: pwsh
        run: |
          if ("${{ matrix.compiler }}" -eq "clang-cl") {
            $env:CC = "clang-cl"
            $env:CXX = "clang-cl"
          } else {
            Remove-Item Env:CC -ErrorAction Ignore
            Remove-Item Env:CXX -ErrorAction Ignore
          }
          cmake -S . -B build/windows-${{ matrix.compiler }} -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DTAU_PARSER_BUILD_STATIC_LIBRARY=ON `
            -DTAU_PARSER_BUILD_TGF=ON `
            -DTAU_PARSER_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build/windows-${{ matrix.compiler }} --config Release

  linux-cross-mingw:
    name: Cross-compile Windows (MinGW)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cross toolchain and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 ninja-build

      - name: Configure
        run: >
          cmake -S . -B build/cross-mingw -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64-x86_64.cmake
          -DTAU_PARSER_BUILD_STATIC_LIBRARY=ON
          -DTAU_PARSER_BUILD_TGF=ON
          -DTAU_PARSER_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build/cross-mingw --config Release
