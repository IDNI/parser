name: Test Release

on:
  push:
    branches: [ "master", "devel", "devel-*", "feature/**", "issue/**" ]
  pull_request:
    branches: [ "master", "devel", "devel-*", "feature/**", "issue/**" ]
  workflow_dispatch:

permissions:
  contents: read
  # A job that builds a missing store package publishes it at once, so the
  # resolving job of each store target asks for packages: write. Every other
  # job only reads.
  packages: read

env:
  TAU_STORE_REMOTE: ghcr.io/${{ github.repository }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The pusher's permission gates every publish step. GitHub checks the
  # pusher, not the commit author, so the guard reads the triggering actor.
  # A pull request never publishes, even when its author has write access.
  guard:
    name: Setup · pusher permission
    # A hung job fails early instead of running to the 6 hour limit.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      allowed: ${{ steps.permission.outputs.allowed }}
    steps:
      - name: Read the pusher's permission
        id: permission
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "pull request: publishing is off"
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          perm="$(gh api "repos/${{ github.repository }}/collaborators/${{ github.triggering_actor }}/permission" --jq '.permission')" \
            || echo "::warning::cannot read the permission of ${{ github.triggering_actor }}"
          echo "pusher ${{ github.triggering_actor }}: permission '${perm}'"
          case "$perm" in
            write|maintain|admin) echo "allowed=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "allowed=false" >> "$GITHUB_OUTPUT" ;;
          esac

  # The base and deps layers, and the linux-x86_64 store. Only the tool layers
  # go to the layer cache: the store is in GHCR, and a reader resolves from it.
  # Change a scope to force a rebuild.
  linux-resolve:
    name: Linux x86_64 · environment
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      # ubuntu-24.04 runners are 4-core
      BUILD_JOBS: 4
      TAU_STORE_PUBLISH: ${{ needs.guard.outputs.allowed == 'true' && 'ON' || 'OFF' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # type=gha needs ACTIONS_RUNTIME_TOKEN/ACTIONS_CACHE_URL, which GitHub
      # does not expose to run: steps
      - uses: crazy-max/ghaction-github-runtime@v4

      - name: Build base stage
        run: |
          ./dev docker base --build-arg BUILD_JOBS=${{ env.BUILD_JOBS }} \
            --cache-from type=gha,scope=parser-base \
            --cache-to   type=gha,scope=parser-base,mode=min

      - name: Build deps stage
        run: |
          ./dev docker deps --build-arg BUILD_JOBS=${{ env.BUILD_JOBS }} \
            --cache-from type=gha,scope=parser-base \
            --cache-from type=gha,scope=parser-deps \
            --cache-to   type=gha,scope=parser-deps,mode=min

      - name: Resolve and publish the store packages
        run: |
          ./dev docker linux-publish \
            --build-arg BUILD_JOBS=${{ env.BUILD_JOBS }} \
            --build-arg TAU_STORE_REMOTE=${{ env.TAU_STORE_REMOTE }} \
            --build-arg TAU_STORE_PUBLISH=${{ env.TAU_STORE_PUBLISH }} \
            --secret id=gh_token,env=GH_TOKEN \
            --cache-from type=gha,scope=parser-deps
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The deps layers are a cache hit. The resolve step reads the packages that
  # the environment job published, so it builds nothing.
  linux:
    name: Linux x86_64 · tests
    needs: linux-resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
      # ccache-prune deletes the older ccache entries of this job.
      actions: write
    env:
      # ubuntu-24.04 runners are 4-core
      BUILD_JOBS: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: crazy-max/ghaction-github-runtime@v4

      # Before actions/cache, so its post step runs after the ccache save.
      - name: Keep one ccache entry
        uses: ./.github/actions/ccache-prune
        with:
          key: ccache-linux-${{ github.sha }}
          prefix: ccache-linux-
          token: ${{ secrets.GITHUB_TOKEN }}

      # A buildkit cache mount lives on the builder, and a runner is
      # discarded after the job, so the ccache directory needs a round trip
      # through the actions cache.
      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: ccache
          key: ccache-linux-${{ github.sha }}
          restore-keys: |
            ccache-linux-

      - name: Load ccache into the build mount
        uses: reproducible-containers/buildkit-cache-dance@v3.4.0
        with:
          cache-map: '{"ccache": "/root/.ccache"}'

      - name: Build and test
        run: |
          ./dev docker linux \
            --build-arg BUILD_JOBS=${{ env.BUILD_JOBS }} \
            --build-arg TAU_STORE_REMOTE=${{ env.TAU_STORE_REMOTE }} \
            --secret id=gh_token,env=GH_TOKEN \
            --cache-from type=gha,scope=parser-deps \
            --cache-from type=gha,scope=parser-base
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # emsdk and the browser test dependencies on the Linux x86_64 deps layers,
  # so the wasm test jobs import them instead of each one building them.
  # Change the scope to force a rebuild.
  wasm-deps:
    name: WebAssembly · environment
    needs: linux-resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # ubuntu-24.04 runners are 4-core
      BUILD_JOBS: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: crazy-max/ghaction-github-runtime@v4

      # mode=min keeps the layers of the final target only, so each slow
      # stage is the final target of its own build.
      - name: Build wasm-deps stage
        run: |
          ./dev docker wasm-deps --build-arg BUILD_JOBS=${{ env.BUILD_JOBS }} \
            --cache-from type=gha,scope=parser-deps \
            --cache-from type=gha,scope=parser-wasm-deps \
            --cache-to   type=gha,scope=parser-wasm-deps,mode=min

      - name: Build wasm-browser-deps stage
        run: |
          ./dev docker wasm-browser-deps --build-arg BUILD_JOBS=${{ env.BUILD_JOBS }} \
            --cache-from type=gha,scope=parser-wasm-deps \
            --cache-from type=gha,scope=parser-wasm-browser-deps \
            --cache-to   type=gha,scope=parser-wasm-browser-deps,mode=min

  # The wasm32-emscripten resolver: the wasm-publish stage it drives publishes
  # the FTXUI and unordered_dense packages. parser-wasm is produced after that
  # publish, so it never reaches GHCR. The publish is its own stage, so the
  # node build imports the same resolve layers the browser job reads.
  wasm-node:
    name: WebAssembly · tests (node)
    needs: [guard, wasm-deps]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      # ubuntu-24.04 runners are 4-core
      BUILD_JOBS: 4
      TAU_STORE_PUBLISH: ${{ needs.guard.outputs.allowed == 'true' && 'ON' || 'OFF' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: crazy-max/ghaction-github-runtime@v4

      - name: Publish the wasm store packages
        run: |
          ./dev docker wasm-publish \
            --build-arg BUILD_JOBS=${{ env.BUILD_JOBS }} \
            --build-arg TAU_STORE_REMOTE=${{ env.TAU_STORE_REMOTE }} \
            --build-arg TAU_STORE_PUBLISH=${{ env.TAU_STORE_PUBLISH }} \
            --secret id=gh_token,env=GH_TOKEN \
            --cache-from type=gha,scope=parser-wasm-deps
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and test
        run: |
          ./dev docker wasm-node \
            --build-arg BUILD_JOBS=${{ env.BUILD_JOBS }} \
            --build-arg TAU_STORE_REMOTE=${{ env.TAU_STORE_REMOTE }} \
            --secret id=gh_token,env=GH_TOKEN \
            --cache-from type=gha,scope=parser-wasm-deps \
            --cache-from type=gha,scope=parser-wasm-build \
            --cache-to   type=gha,scope=parser-wasm-build,mode=min
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The native tgf configure of the browser gate reads the linux-x86_64
  # packages of the Linux x86_64 environment, so it waits for that job, not
  # for the Linux x86_64 test job.
  wasm-browser:
    name: WebAssembly · tests (browser)
    needs: [wasm-deps, wasm-node, linux-resolve]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # ubuntu-24.04 runners are 4-core
      BUILD_JOBS: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: crazy-max/ghaction-github-runtime@v4

      - name: Build and test
        run: |
          ./dev docker wasm-browser \
            --build-arg BUILD_JOBS=${{ env.BUILD_JOBS }} \
            --build-arg TAU_STORE_REMOTE=${{ env.TAU_STORE_REMOTE }} \
            --secret id=gh_token,env=GH_TOKEN \
            --cache-from type=gha,scope=parser-wasm-browser-deps \
            --cache-from type=gha,scope=parser-wasm-build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The x86_64 environment on an arm runner, so the arm64 store packages are
  # built natively. Its one scope holds the arm64 tool layers only: the x86
  # layers never match an arm runner.
  linux-arm64-resolve:
    name: Linux arm64 · environment
    needs: guard
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      # ubuntu-24.04-arm runners are 4-core
      BUILD_JOBS: 4
      TAU_STORE_PUBLISH: ${{ needs.guard.outputs.allowed == 'true' && 'ON' || 'OFF' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: crazy-max/ghaction-github-runtime@v4

      # deps derives from base, so its mode=min layers hold base as well.
      - name: Build deps stage
        run: |
          ./dev docker deps --build-arg BUILD_JOBS=${{ env.BUILD_JOBS }} \
            --cache-from type=gha,scope=parser-linux-arm64-deps \
            --cache-to   type=gha,scope=parser-linux-arm64-deps,mode=min

      - name: Resolve and publish the store packages
        run: |
          ./dev docker linux-publish \
            --build-arg BUILD_JOBS=${{ env.BUILD_JOBS }} \
            --build-arg TAU_STORE_REMOTE=${{ env.TAU_STORE_REMOTE }} \
            --build-arg TAU_STORE_PUBLISH=${{ env.TAU_STORE_PUBLISH }} \
            --secret id=gh_token,env=GH_TOKEN \
            --cache-from type=gha,scope=parser-linux-arm64-deps
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The deps layers are a cache hit. The resolve step reads the packages that
  # the environment job published, so it builds nothing.
  linux-arm64:
    name: Linux arm64 · tests
    needs: linux-arm64-resolve
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    env:
      # ubuntu-24.04-arm runners are 4-core
      BUILD_JOBS: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: crazy-max/ghaction-github-runtime@v4

      - name: Build and test
        run: |
          ./dev docker linux \
            --build-arg BUILD_JOBS=${{ env.BUILD_JOBS }} \
            --build-arg TAU_STORE_REMOTE=${{ env.TAU_STORE_REMOTE }} \
            --secret id=gh_token,env=GH_TOKEN \
            --cache-from type=gha,scope=parser-linux-arm64-deps
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The Windows MSVC environment: the windows-x86_64-msvc store. It resolves
  # both presets, cl.exe and clang-cl; the test matrix below needs it and
  # finds the packages in GHCR.
  windows-msvc-store:
    name: Windows MSVC · environment
    needs: guard
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        shell: bash
    env:
      # windows-latest runners are 4-core
      TAU_BUILD_JOBS: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6

      # clang-cl uses the MSVC headers and libraries, so both presets need
      # this environment.
      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install oras for the dependency store
        run: ./dev dep-oras

      - name: Log in to the dependency store
        run: oras login "${TAU_STORE_REMOTE%%/*}" -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"

      - name: Resolve the cl.exe store packages
        run: |
          ./dev preset release-msvc-all --configure-only -DTAU_BUILD_JOBS=${{ env.TAU_BUILD_JOBS }} \
            -DTAU_PARSER_DEPS_FROM_STORE=ON

      - name: Resolve the clang-cl store packages
        run: |
          ./dev preset release-msvc-all-clang-cl --configure-only \
            -DTAU_BUILD_JOBS=${{ env.TAU_BUILD_JOBS }} \
            -DTAU_PARSER_DEPS_FROM_STORE=ON

      - name: Publish the store packages
        if: needs.guard.outputs.allowed == 'true'
        run: ./dev store-publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The name holds no matrix value: GitHub appends "(cl)" or "(clang-cl)" to
  # a run, and a skipped job shows no unexpanded expression.
  windows-msvc:
    name: Windows MSVC · tests
    needs: windows-msvc-store
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      # windows-latest runners are 4-core
      TAU_BUILD_JOBS: 4
      PRESET: ${{ matrix.compiler == 'clang-cl' && 'release-msvc-all-clang-cl' || 'release-msvc-all' }}
    strategy:
      fail-fast: false
      matrix:
        compiler: [cl, clang-cl]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6

      # clang-cl uses the MSVC headers and libraries, so both presets need
      # this environment.
      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Restore the dependency store (~/.tau/store)
        id: cache-store
        uses: actions/cache/restore@v6
        with:
          path: ~/.tau/store
          key: parser-store-windows-latest-${{ github.sha }}
          restore-keys: |
            parser-store-windows-latest-

      - name: Install oras for the dependency store
        run: ./dev dep-oras

      - name: Log in to the dependency store
        run: oras login "${TAU_STORE_REMOTE%%/*}" -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"

      # Git Bash runs ./dev, and the preset carries the compiler choice.
      - name: Build and test
        run: |
          ./dev preset ${{ env.PRESET }} run -DTAU_BUILD_JOBS=${{ env.TAU_BUILD_JOBS }} \
            -DTAU_PARSER_DEPS_FROM_STORE=ON

      - name: Save the dependency store (~/.tau/store)
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ~/.tau/store
          key: ${{ steps.cache-store.outputs.cache-primary-key }}

  # The darwin-arm64 environment: resolves and publishes the store and saves
  # it for the tests job below. The key names the arch, so the two macOS
  # platforms never share an entry.
  macos-arm64-store:
    name: macOS arm64 · environment
    needs: guard
    runs-on: macos-15
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write
    env:
      # macos-15 runners are 3-core arm64
      TAU_BUILD_JOBS: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Restore the dependency store (~/.tau/store)
        id: cache-store
        uses: actions/cache/restore@v6
        with:
          path: ~/.tau/store
          key: parser-store-macos-arm64-${{ github.sha }}
          restore-keys: |
            parser-store-macos-arm64-

      - name: Install oras for the dependency store
        run: ./dev dep-oras

      - name: Log in to the dependency store
        run: oras login "${TAU_STORE_REMOTE%%/*}" -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"

      - name: Resolve the store packages
        run: |
          ./dev preset release-all --configure-only \
            -DTAU_BUILD_JOBS=${{ env.TAU_BUILD_JOBS }} \
            -DTAU_PARSER_DEPS_FROM_STORE=ON

      - name: Publish the store packages
        if: needs.guard.outputs.allowed == 'true'
        run: ./dev store-publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save the dependency store (~/.tau/store)
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ~/.tau/store
          key: ${{ steps.cache-store.outputs.cache-primary-key }}

  # The store comes from the cache that the environment job saved in this
  # run, so a run without publish rights builds no store package either.
  macos-arm64:
    name: macOS arm64 · tests
    needs: macos-arm64-store
    runs-on: macos-15
    timeout-minutes: 240
    env:
      # macos-15 runners are 3-core arm64
      TAU_BUILD_JOBS: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The schema and REPL tests need new jsonschema, pexpect and pyte. uv
      # builds the venv, and its bin lands ahead of Homebrew in PATH where
      # configure finds the python3 probe.
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          # the same uv as the Docker base image
          version: "0.12.13"

      - name: Install the Python test modules
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/tau-python"
          uv pip install --python "$RUNNER_TEMP/tau-python/bin/python" \
            -r tests/requirements.txt
          echo "$RUNNER_TEMP/tau-python/bin" >> "$GITHUB_PATH"

      # An exact hit holds every package, so configure never reads the remote.
      - name: Restore the dependency store (~/.tau/store)
        uses: actions/cache/restore@v6
        with:
          path: ~/.tau/store
          key: parser-store-macos-arm64-${{ github.sha }}
          fail-on-cache-miss: true

      # `run` on an -all preset makes ./dev call ctest itself.
      - name: Build and test
        run: |
          ./dev preset release-all run -DTAU_BUILD_JOBS=${{ env.TAU_BUILD_JOBS }} \
            -DTAU_PARSER_DEPS_FROM_STORE=ON

  # The darwin-x86_64 environment: resolves and publishes the store and saves
  # it for the tests job below. The key names the arch, so the two macOS
  # platforms never share an entry.
  macos-x86_64-store:
    name: macOS x86_64 · environment
    needs: guard
    runs-on: macos-15-intel
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write
    env:
      # macos-15-intel runners are 4-core x86_64
      TAU_BUILD_JOBS: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Restore the dependency store (~/.tau/store)
        id: cache-store
        uses: actions/cache/restore@v6
        with:
          path: ~/.tau/store
          key: parser-store-macos-x86_64-${{ github.sha }}
          restore-keys: |
            parser-store-macos-x86_64-

      - name: Install oras for the dependency store
        run: ./dev dep-oras

      - name: Log in to the dependency store
        run: oras login "${TAU_STORE_REMOTE%%/*}" -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"

      - name: Resolve the store packages
        run: |
          ./dev preset release-all --configure-only \
            -DTAU_BUILD_JOBS=${{ env.TAU_BUILD_JOBS }} \
            -DTAU_PARSER_DEPS_FROM_STORE=ON

      - name: Publish the store packages
        if: needs.guard.outputs.allowed == 'true'
        run: ./dev store-publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save the dependency store (~/.tau/store)
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ~/.tau/store
          key: ${{ steps.cache-store.outputs.cache-primary-key }}

  # The store comes from the cache that the environment job saved in this
  # run, so a run without publish rights builds no store package either.
  macos-x86_64:
    name: macOS x86_64 · tests
    needs: macos-x86_64-store
    runs-on: macos-15-intel
    timeout-minutes: 240
    env:
      # macos-15-intel runners are 4-core x86_64
      TAU_BUILD_JOBS: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The schema and REPL tests need new jsonschema, pexpect and pyte. uv
      # builds the venv, and its bin lands ahead of Homebrew in PATH where
      # configure finds the python3 probe.
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          # the same uv as the Docker base image
          version: "0.12.13"

      - name: Install the Python test modules
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/tau-python"
          uv pip install --python "$RUNNER_TEMP/tau-python/bin/python" \
            -r tests/requirements.txt
          echo "$RUNNER_TEMP/tau-python/bin" >> "$GITHUB_PATH"

      # An exact hit holds every package, so configure never reads the remote.
      - name: Restore the dependency store (~/.tau/store)
        uses: actions/cache/restore@v6
        with:
          path: ~/.tau/store
          key: parser-store-macos-x86_64-${{ github.sha }}
          fail-on-cache-miss: true

      # `run` on an -all preset makes ./dev call ctest itself.
      - name: Build and test
        run: |
          ./dev preset release-all run -DTAU_BUILD_JOBS=${{ env.TAU_BUILD_JOBS }} \
            -DTAU_PARSER_DEPS_FROM_STORE=ON
